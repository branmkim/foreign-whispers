[project]
name = "foreign-whispers"
version = "0.1.0"
description = "Foreign Whispers: YouTube video dubbing pipeline (download, transcribe, translate, TTS, video stitching)"
license = { text = "LicenseRef-AGPL-3.0-only-with-Commons-Clause" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "TTS>=0.22.0",
    "yt-dlp",
    "youtube-transcript-api",
    "openai-whisper",
    "moviepy<2",
    "argostranslate",
    "streamlit",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "pyrubberband",
    "librosa",
    "soundfile",
    "pydub",
    "requests",
    "setuptools<81",
    "pyyaml>=6.0.3",
    "logfire",
    # Optional rerank path (get_shorter_translations → Ollama); needs Ollama server (OLLAMA_HOST).
    "ollama>=0.4",
    # Gemini rerank fallback: ``from google import genai`` (GOOGLE_API_KEY).
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "nbconvert>=7.17.0",
    "scikit-learn>=1.4",
]
alignment = [
    "logfire",
    "silero-vad",
    "pyannote.audio",
    # Keep torchcodec aligned with torch 2.10 (torchcodec 0.11 targets torch 2.11).
    "torchcodec>=0.10,<0.11",
    # CUDA-enabled TorchCodec needs libnvrtc and libnpp (torchcodec README); slim images have no system CUDA.
    "nvidia-cuda-nvrtc>=13.0,<14; sys_platform == 'linux'",
    "nvidia-npp-cu12>=12.3,<13; sys_platform == 'linux'",
]

[tool.uv]
constraint-dependencies = [
    "onnxruntime<1.24",
    "numpy<2",
    "transformers<4.46",
]
find-links = [
    "https://download.pytorch.org/whl/cu128",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# torchcodec+cu128: see alignment group nvidia-* wheels; Docker entrypoint sets LD_LIBRARY_PATH (scripts/docker-cuda-ld.sh).
torchcodec = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "requires_silero: needs silero-vad and torch installed",
    "requires_pyannote: needs pyannote.audio installed and FW_HF_TOKEN set",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foreign_whispers"]
